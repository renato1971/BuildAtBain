readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai==0.177.0",
    "crewai-tools>=0.71.0",
    "psycopg2-binary==2.9.10",
    "pymupdf>=1.26.4",
    "python-dotenv>=1.1.1",
    "vl-convert-python>=1.8.0",
    "weasyprint>=66.0",
    "weaviate-client>=4.16.10",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
